# Insights ingestion (Phase I3, roadmap §2) — the "Path B" runner from
# AGENTS.md rule 8: fetches every source, validates with zod, computes the
# snapshot with the scoring engine and writes it to Workers KV through the
# Cloudflare REST API. The Worker only reads the precomputed result.
#
# Schedule: 04:20 UTC daily. The account's free KV write budget (1,000/day,
# account-wide) is saturated by the ever-green rates cron by ~18:30 UTC —
# 04:20 lands inside the fresh post-midnight slice with ~750 writes of
# headroom (see docs/insights/03-data-sources.md, Phase I3 record).
#
# RUNNER EXHAUSTION (since 2026-10-20): this account's free GitHub Actions
# minutes exhausted — the job fails at runner allocation. The Worker's own
# minute-cron (apps/api/src/insights-ingest-cron.ts) owns the ingest as the
# PRIMARY venue since then (verified live through the 04:10/04:20/04:25+
# 04:27/04:40 rungs). This workflow stays as belt-and-braces: if GHA
# recovers, both venues write the same bytes (idempotent content). No paid
# plan is needed for either path.
#
# The job exits non-zero when any P1 indicator is unavailable (product
# degraded). Failure signals (Phase I7 alerting): this red run (GitHub's
# own Actions notification email), the /admin Insights staleness pill
# (flips past 36 h without a run), and an optional Telegram push to the
# owner — active as soon as TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID secrets
# exist (see the final step; a clean no-op until then).
name: insights-ingest

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch + score only — no KV writes"
        type: boolean
        default: false

permissions:
  contents: read

# Never overlap runs: a slow RBA/ABS fetch must not race a second run's writes.
concurrency:
  group: insights-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Identifiers, not secrets (the namespace id also lives in
      # apps/api/wrangler.jsonc; the repo is private).
      CLOUDFLARE_ACCOUNT_ID: "5f123468027e4b2094167df1d2f2e852"
      INSIGHTS_KV_NAMESPACE_ID: "4627ac33a4b148ff9fc2189266b1890e" # RATES namespace
      INSIGHTS_RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager" (root).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          pnpm --filter @currena/insights ingest $ARGS

      # I7 alerting (BACKLOG #46): push a failure notice to the owner's
      # Telegram when the bot secrets exist; otherwise a clean no-op — the
      # red run + the /admin staleness pill are the signals. No owner setup
      # is required for this workflow to keep working as before.
      - name: Notify owner on failure (Telegram, optional)
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not configured — skipping the push notification."
            echo "Still firing: this red run (GitHub Actions notifications) + the /admin Insights staleness pill past 36 h."
            exit 0
          fi
          MSG="❌ Currena insights-ingest FAILED — ${{ github.event_name }} run on ${{ github.sha }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          HTTP=$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT_ID" --data-urlencode "text=$MSG" \
            -o /dev/null -w '%{http_code}')
          echo "telegram HTTP $HTTP"
          # The run is already failed — a notification hiccup must not mask
          # the original conclusion, so log and move on unless Telegram
          # rejected the request outright (bad token/chat is worth seeing).
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "429" ]; then
            echo "::warning::Telegram notification failed (HTTP $HTTP) — check TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID."
          fi
