name: TGJU reachability probe (Gate 2 evidence)

# TEMPORARY Gate-2 diagnostic workflow — the same battery as the currena-probe
# Worker, run from a GitHub Actions runner (the Plan B egress path).
# Manually dispatched; delete after the Path A/B decision.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe TGJU + Frankfurter from the runner
        run: |
          set -u
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          probe() {
            label="$1"; url="$2"
            out="$(mktemp)"; err="$(mktemp)"
            start=$(date +%s%3N)
            code="$(curl -sS -L --max-time 20 -o "$out" -w '%{http_code}' \
              -A "$UA" \
              -H 'Accept: text/html,application/json;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: en-US,en;q=0.9' \
              "$url" 2>"$err")" || true
            end=$(date +%s%3N)
            size="$(wc -c < "$out" | tr -d ' ')"
            echo "--> ${label} · HTTP ${code:-000} · $((end-start))ms · ${size} bytes · ${url}"
            head -c 160 "$out" | tr '\n' ' '; echo
            if [ -s "$err" ]; then echo "    curl-stderr: $(head -c 160 "$err")"; fi
            rm -f "$out" "$err"
          }
          probe tgju-profile-dollar 'https://www.tgju.org/profile/price_dollar_rl'
          probe tgju-profile-eur    'https://www.tgju.org/profile/price_eur'
          probe tgju-api-summary    'https://api.tgju.org/v1/market/indicator/summary'
          probe tgju-call1-ajax     'https://call1.tgju.org/ajax.json'
          probe frankfurter-latest  'https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR'

      - name: Cross-check — fetch the deployed probe Worker battery
        run: |
          echo "Cross-check: GH runner -> currena-probe Worker -> TGJU battery"
          curl -sS --max-time 120 'https://currena-probe.sedanama-ir.workers.dev/probe/all' || echo "(worker cross-check failed)"
