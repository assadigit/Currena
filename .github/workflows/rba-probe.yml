name: rba-probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe RBA table index + BLS schedule
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          echo "=== RBA statistics tables index: lines mentioning deposit ==="
          curl -s --max-time 60 -A "$UA" "https://www.rba.gov.au/statistics/tables/" | grep -oiE 'href="[^"]*"[^>]*>[^<]*deposit[^<]*|>[^<]*deposit[^<]*' | head -20
          echo
          echo "=== RBA tables index: F-table filenames ==="
          curl -s --max-time 60 -A "$UA" "https://www.rba.gov.au/statistics/tables/" | grep -oE 'href="[^"]*csv[^"]*"' | head -40
          echo
          echo "=== BLS employment situation schedule (upcoming 2026) ==="
          curl -s --max-time 60 -A "$UA" "https://www.bls.gov/schedule/news_release/empsit.htm" | sed 's/<[^>]*>/ /g' | tr -s ' \n' ' ' | grep -oE "(January|February|March|April|May|June|July|August|September|October|November|December) [0-9]{1,2}, 2026" | head -20
          echo
          echo "=== BLS CPI schedule (upcoming 2026) ==="
          curl -s --max-time 60 -A "$UA" "https://www.bls.gov/schedule/news_release/cpi.htm" | sed 's/<[^>]*>/ /g' | tr -s ' \n' ' ' | grep -oE "(January|February|March|April|May|June|July|August|September|October|November|December) [0-9]{1,2}, 2026" | head -20
