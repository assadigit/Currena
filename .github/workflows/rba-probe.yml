name: rba-probe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: F4.1 tail + BLS via archive.org
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          echo "=== RBA F4.1 head 13 ==="
          curl -s --max-time 60 -A "$UA" "https://www.rba.gov.au/statistics/tables/csv/f4.1-data.csv" -o /tmp/f41.csv || true
          head -13 /tmp/f41.csv
          echo "--- tail 4:"
          tail -4 /tmp/f41.csv
          echo
          echo "=== RBA F4 (savings cols) tail 2 ==="
          curl -s --max-time 60 -A "$UA" "https://www.rba.gov.au/statistics/tables/csv/f4-data.csv" -o /tmp/f4.csv || true
          head -11 /tmp/f4.csv | tail -3
          tail -2 /tmp/f4.csv
          echo
          echo "=== archive.org availability ==="
          curl -s --max-time 40 "http://archive.org/wayback/available?url=bls.gov/schedule/news_release/empsit.htm&timestamp=20261001" || echo "wayback unavailable"
          echo
          echo "=== wayback empsit snapshot ==="
          curl -s -L --max-time 60 -A "$UA" "https://web.archive.org/web/2026/https://www.bls.gov/schedule/news_release/empsit.htm" -o /tmp/wb.html -w "HTTP %{http_code} size %{size_download}\n" || true
          grep -oiE "(November|December|January)[^<]{0,6}(3rd|4th|5th|6th|10th|11th|12th)?[^A-Za-z]{0,4}[0-9]{1,2},? 202[67]" /tmp/wb.html | head -20 || true
          echo "--- wayback raw text dates:"
          sed 's/<[^>]*>/ /g' /tmp/wb.html | tr -s ' \n' ' ' | grep -oE "[A-Z][a-z]+ [0-9]{1,2}, 202[67]" | head -25 || true
