<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gold balance: visual prototype (throwaway, specs only)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Tokens: names belong to this product's world (assay office, brass, ivory). */
  :root {
    --page: #f1f4f8;
    --ivory: #fffdf8;
    --paper: #ffffff;
    --ink: #2c3e50;
    --ink-2: #47525d;
    --ink-3: #6a7684;
    --hairline: rgba(44, 62, 80, 0.12);
    --hairline-soft: rgba(44, 62, 80, 0.07);
    --brass-hi: #fbe3a0;
    --brass-mid: #eab544;
    --brass-lo: #b27a1d;
    --brass-ink: #5b3d08;
    --patina: #1f9d55;
    --madder: #d6303a;
    --stone-hi: #eef2f6;
    --stone-lo: #c7d0da;
    --recess: #f3f5f8;
    --glow: rgba(243, 177, 63, 0.16);
    --shadow-card: 0 0 0 1px rgba(44,62,80,.06), 0 1px 2px -1px rgba(44,62,80,.08), 0 18px 48px -18px rgba(168,126,28,.28);
    --shadow-disc: 0 1px 1px rgba(91,61,8,.25), 0 6px 10px -4px rgba(91,61,8,.35);
    --font: Poppins, ui-sans-serif, system-ui, sans-serif;
  }
  .dark {
    --page: #0c1118;
    --ivory: #19212c;
    --paper: #1a222e;
    --ink: #e8edf4;
    --ink-2: #b5c0cf;
    --ink-3: #8c9aae;
    --hairline: rgba(255, 255, 255, 0.10);
    --hairline-soft: rgba(255, 255, 255, 0.06);
    --brass-hi: #f3d488;
    --brass-mid: #d9a43e;
    --brass-lo: #8f5f14;
    --brass-ink: #2a1c04;
    --patina: #4bc27d;
    --madder: #f07078;
    --stone-hi: #46546a;
    --stone-lo: #2b3646;
    --recess: #141b25;
    --glow: rgba(243, 177, 63, 0.10);
    --shadow-card: 0 0 0 1px rgba(255,255,255,.08), 0 24px 60px -20px rgba(0,0,0,.7);
    --shadow-disc: 0 0 0 1px rgba(255,255,255,.10), 0 6px 10px -4px rgba(0,0,0,.6);
  }
  [dir="rtl"] { --font: Vazirmatn, Poppins, ui-sans-serif, system-ui, sans-serif; }

  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); line-height: 1.5; }
  .demo-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; font-size: 12px; align-items: center; }
  .demo-bar button { font: inherit; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--hairline); background: var(--paper); color: var(--ink); cursor: pointer; }
  .demo-bar button[aria-pressed="true"] { background: var(--brass-mid); border-color: var(--brass-lo); color: var(--brass-ink); }
  .demo-wrap { max-width: 1120px; margin: 0 auto; padding: 8px 16px 48px; }

  /* The card */
  .gb {
    position: relative; isolation: isolate;
    border-radius: 28px; padding: clamp(18px, 4vw, 44px);
    background:
      radial-gradient(120% 60% at 50% -10%, var(--glow), transparent 60%),
      linear-gradient(180deg, var(--ivory), var(--paper) 55%);
    box-shadow: var(--shadow-card);
  }
  .gb-head { max-width: 640px; margin: 0 auto; text-align: center; }
  .gb-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-lo); margin: 0 0 8px; }
  [dir="rtl"] .gb-eyebrow { letter-spacing: 0; }
  .gb-title { margin: 0; font-size: clamp(20px, 3.2vw, 28px); line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
  .gb-sub { margin: 10px auto 0; font-size: 14px; color: var(--ink-2); text-wrap: pretty; max-width: 52ch; }

  /* Stage */
  .stage { position: relative; width: 100%; margin: clamp(8px, 2vw, 20px) auto 0; }
  .stage svg.mech { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .pan {
    position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px 8px 22px; border-radius: 14px 14px 34px 34px / 14px 14px 26px 26px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--tint) 7%, transparent), color-mix(in srgb, var(--tint) 3%, transparent));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tint) 16%, transparent);
    will-change: transform;
  }
  .pan::after {
    content: ""; position: absolute; inset-inline: 5%; bottom: 0; height: 8px; border-radius: 999px;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass-mid) 45%, var(--brass-lo));
    box-shadow: 0 5px 8px -3px rgba(91,61,8,.4);
  }
  .pan-for { --tint: var(--patina); }
  .pan-against { --tint: var(--madder); }
  .pan-cap { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--tint); text-align: center; line-height: 1.25; }
  .pan-cap svg { width: 14px; height: 14px; flex: none; }
  .pan-empty { margin: auto; padding: 0 10px; font-size: 12px; color: var(--ink-3); text-align: center; text-wrap: balance; }
  .weights { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; }
  .weight { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 78px; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; border-radius: 14px; }
  .weight:focus-visible, .row-btn:focus-visible { outline: 2px solid var(--brass-mid); outline-offset: 3px; }
  .weight-label { font-size: 12px; font-weight: 500; line-height: 1.2; text-align: center; color: var(--ink); text-wrap: balance; }
  .disc { position: relative; width: var(--d, 58px); height: var(--d, 58px); flex: none; }
  .disc svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .disc .face { filter: drop-shadow(0 4px 5px rgba(91,61,8,.30)); }
  .badge-split { position: absolute; inset-block-start: -6px; inset-inline-end: -14px; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 999px; background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1px var(--hairline), 0 2px 4px rgba(0,0,0,.12); }

  /* Verdict */
  .verdict { margin: clamp(10px, 2vw, 22px) auto 0; text-align: center; }
  .verdict-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  [dir="rtl"] .verdict-eyebrow { letter-spacing: 0; }
  .verdict-word { margin: 4px 0 0; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; }
  .verdict-word[data-side="for"] { color: var(--patina); }
  .verdict-word[data-side="against"] { color: var(--madder); }
  .lanes-bar { display: inline-grid; grid-auto-flow: column; gap: 6px; margin-top: 14px; }
  .lanes-bar i { width: clamp(28px, 8vw, 44px); height: 6px; border-radius: 999px; background: var(--hairline); }
  .lanes-bar i[data-side="for"] { background: var(--patina); }
  .lanes-bar i[data-side="against"] { background: var(--madder); }
  .lanes-bar i[data-side="neutral"] { background: var(--stone-lo); }
  .verdict-counts { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .context { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; margin-top: 14px; padding: 7px 14px; border-radius: 999px; background: var(--recess); font-size: 12.5px; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--hairline-soft); }
  .context b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* Tray */
  .tray { margin: clamp(18px, 3vw, 32px) auto 0; max-width: 760px; padding: 14px 18px 16px; border-radius: 20px; background: var(--recess); box-shadow: inset 0 1px 3px rgba(0,0,0,.06), inset 0 0 0 1px var(--hairline-soft); }
  .tray-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 12px; }
  .tray-title { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .tray-note { font-size: 12px; color: var(--ink-3); }
  .tray .weights { justify-content: center; gap: 12px 22px; }
  .tray .weight { width: 92px; }
  .tray .disc { --d: 46px; }
  .tray-empty { font-size: 13px; color: var(--ink-3); text-align: center; margin: 4px 0; }

  /* Ledger */
  .ledger { list-style: none; margin: clamp(20px, 3vw, 32px) auto 0; padding: 0; max-width: 760px; display: grid; gap: 2px; }
  .row { border-radius: 18px; }
  .row[open-state="true"] { background: var(--recess); box-shadow: inset 0 0 0 1px var(--hairline-soft); }
  .row-btn { width: 100%; display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 14px; padding: 12px 14px; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; text-align: start; border-radius: 18px; min-height: 64px; }
  .row-btn:hover { background: color-mix(in srgb, var(--recess) 70%, transparent); }
  .row-name { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .row-state { font-size: 13px; color: var(--ink-2); }
  .row-state[data-side="for"] { color: var(--patina); }
  .row-state[data-side="against"] { color: var(--madder); }
  .row-tally { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chev { width: 18px; height: 18px; color: var(--ink-3); transition: transform .2s cubic-bezier(.23,1,.32,1); }
  .row[open-state="true"] .chev { transform: rotate(180deg); }
  .row .disc { --d: 40px; }
  .members { padding: 2px 18px 16px; display: grid; gap: 6px; }
  .members[hidden] { display: none; }
  .m { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: baseline; font-size: 13px; }
  .m i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; transform: translateY(-1px); }
  .m[data-i="S"] i { background: var(--patina); } .m[data-i="P"] i { background: var(--madder); }
  .m[data-i="U"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .m-ev { color: var(--ink-3); font-size: 12.5px; }
  .steady { margin-top: 4px; font-size: 12.5px; color: var(--ink-3); text-wrap: pretty; }

  .foot { max-width: 640px; margin: clamp(20px, 3vw, 32px) auto 0; text-align: center; font-size: 12.5px; color: var(--ink-3); text-wrap: pretty; }
  .foot a { color: var(--ink-2); text-decoration-color: var(--brass-mid); text-underline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="faceBrass" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="var(--brass-hi)"/><stop offset="55%" stop-color="var(--brass-mid)"/><stop offset="100%" stop-color="var(--brass-lo)"/>
    </radialGradient>
    <radialGradient id="faceStone" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="var(--stone-hi)"/><stop offset="100%" stop-color="var(--stone-lo)"/>
    </radialGradient>
    <linearGradient id="beamBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--brass-hi)"/><stop offset="50%" stop-color="var(--brass-mid)"/><stop offset="100%" stop-color="var(--brass-lo)"/>
    </linearGradient>
  </defs>
</svg>

<div class="demo-bar" id="bar"></div>
<div class="demo-wrap"><section class="gb" id="gb" aria-label="Gold balance"></section></div>

<script>
const I18N = {
  en: {
    eyebrow: "Gold · today's conditions",
    title: "The aggregate of factors affecting the price of gold",
    sub: "Gold's four main drivers are each read against their usual range and weighed equally. The beam shows today's lean. It is not a forecast.",
    capFor: "Supporting gold", capAgainst: "Pressuring gold", empty: "Nothing on this side",
    verdictEyebrow: "Today's lean", v: { for: "Leaning for gold", balanced: "Balanced", against: "Leaning against gold", none: "Can't read the conditions" },
    counts: (f,a,n,u)=>`${f} for · ${a} against · ${n} not leaning` + (u?` · ${u} unread`:''),
    context: (c)=>`Gold, last 30 days <b>${c}</b> · context only, not counted`,
    trayTitle: "Not leaning", trayNote: "Weighed, but no clear lean", trayEmpty: "Every driver is on a pan.",
    split: "Split", unreadTitle: "Couldn't be read",
    lane: { borrow: "Borrowing costs", dollar: "The dollar", stress: "Market stress", inflation: "Inflation" },
    state: { for: "Leans for gold", against: "Leans against gold", neutral: "Not leaning", split: (s,p)=>`Split: ${s} for, ${p} against`, unread: "Couldn't be read" },
    tally: (f,r)=> f? `${f} of ${r} firing` : (r? 'None firing':'No data'),
    S: "Supports", P: "Pressures", U: "Unread", steady: (n,names)=>`Not firing (${n}): ${names}`,
    foot: `This describes today's conditions. It is not a forecast. Over 2016 to 2026 the same drivers showed no positive link to gold's next moves. <a href="#">Read the full backtest</a>`,
    ev: { falling:"falling", rising:"rising", high:"high in its decade", low:"low in its decade" },
    voters: { borrow:["Real yields","US 10-year yield","US 30-year yield","Fed policy rate","Fed expectations","ECB deposit rate","Yield curve 10y-2y","Yield curve 10y-3m"], dollar:["Dollar index","USD/JPY","US-Japan 10y gap"], stress:["Financial stress (STLFSI)","Financial conditions (NFCI)","VIX","Gold-silver ratio","Futures positioning"], inflation:["US CPI","US core PCE","Euro HICP","5y5y breakeven","Inflation tilt"] }
  },
  fa: {
    eyebrow: "طلا · شرایط امروز",
    title: "برآیند عوامل مؤثر بر قیمت طلا",
    sub: "چهار عامل اصلی مؤثر بر طلا هرکدام در برابر محدودهٔ معمولشان خوانده و با وزن برابر سنجیده می‌شوند. ترازو گرایش امروز را نشان می‌دهد و پیش‌بینی نیست.",
    capFor: "به نفع قیمت طلا", capAgainst: "علیه قیمت طلا", empty: "چیزی در این کفه نیست",
    verdictEyebrow: "گرایش امروز", v: { for: "به نفع طلا", balanced: "متعادل", against: "علیه طلا", none: "شرایط قابل ارزیابی نیست" },
    counts: (f,a,n,u)=>`${f} موافق · ${a} مخالف · ${n} بدون گرایش` + (u?` · ${u} ناخوانده`:''),
    context: (c)=>`طلا در ۳۰ روز گذشته <b>${c}</b> · فقط برای زمینه، حساب نمی‌شود`,
    trayTitle: "بدون گرایش", trayNote: "سنجیده شد، اما گرایش روشنی نیست", trayEmpty: "همهٔ عوامل روی کفه‌ها هستند.",
    split: "دوپاره", unreadTitle: "قابل‌خواندن نبود",
    lane: { borrow: "هزینهٔ استقراض", dollar: "دلار", stress: "تنش بازار", inflation: "تورم" },
    state: { for: "به نفع طلا", against: "علیه طلا", neutral: "بدون گرایش", split: (s,p)=>`دوپاره: ${s} موافق، ${p} مخالف`, unread: "قابل‌خواندن نبود" },
    tally: (f,r)=> f? `${f} از ${r} فعال` : (r? 'هیچ‌کدام فعال نیست':'بدون داده'),
    S: "به نفع", P: "علیه", U: "ناخوانده", steady: (n,names)=>`غیرفعال (${n}): ${names}`,
    foot: `این ترازو شرایط امروز را توصیف می‌کند و پیش‌بینی نیست. در سال‌های ۲۰۱۶ تا ۲۰۲۶ همین عوامل رابطهٔ مثبتی با حرکت بعدی طلا نشان ندادند. <a href="#">گزارش کامل بک‌تست</a>`,
    ev: { falling:"در حال کاهش", rising:"در حال افزایش", high:"بالا در بازهٔ ده‌ساله", low:"پایین در بازهٔ ده‌ساله" },
    voters: { borrow:["بازده واقعی","بازده ۱۰ساله آمریکا","بازده ۳۰ساله آمریکا","نرخ سیاستی فدرال","انتظارات از فدرال","نرخ سپردهٔ ECB","شیب ۱۰ و ۲ ساله","شیب ۱۰ ساله و ۳ ماهه"], dollar:["شاخص دلار","دلار/ین","شکاف ۱۰ساله آمریکا و ژاپن"], stress:["تنش مالی","شرایط مالی","وی‌آی‌ایکس","نسبت طلا به نقره","موقعیت قراردادها"], inflation:["شاخص قیمت مصرف‌کننده","هستهٔ PCE","تورم یورو","تورم ۵ساله پس از ۵ سال","شیب تورم"] }
  }
};

const ICONS = {
  borrow: '<line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
  dollar: '<line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  stress: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
  inflation: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'
};
const LANE_KEYS = ['borrow','dollar','stress','inflation'];

/* Scenarios: voter index -> [impact, evidence]. Missing voter = steady. S supports, P pressures, U unread. */
const SCENARIOS = {
  today:   { label: "Today (2026-10-31)", change: "−4.2%",
    borrow:{0:['S','falling'],1:['S','falling'],2:['P','high'],4:['P','high']}, dollar:{1:['P','high']}, stress:{4:['U']}, inflation:{3:['P','falling']} },
  against: { label: "Leaning against", change: "−6.8%",
    borrow:{0:['P','high'],1:['P','high'],2:['P','high'],3:['P','high'],4:['P','high']}, dollar:{0:['P','rising'],1:['P','high']}, stress:{}, inflation:{0:['S','rising'],1:['S','rising'],3:['P','falling']} },
  for:     { label: "Leaning for (strong)", change: "+5.1%",
    borrow:{0:['S','falling'],1:['S','falling'],2:['S','falling'],4:['S','falling']}, dollar:{0:['S','falling'],1:['S','falling']}, stress:{0:['S','rising'],2:['S','high']}, inflation:{} },
  split:   { label: "One lane split", change: "+0.8%",
    borrow:{0:['S','falling'],1:['S','falling'],2:['P','high'],3:['P','high']}, dollar:{0:['S','falling'],1:['S','falling']}, stress:{}, inflation:{3:['S','rising'],0:['S','rising']} },
  none:    { label: "Can't read", change: "n/a",
    borrow:'U', dollar:'U', stress:'U', inflation:'U' }
};

/* The lane engine (02 §3): MIN_FIRING = 2, strict majority of firing, tie = split. */
function engine(sc, t) {
  const lanes = LANE_KEYS.map((k) => {
    const names = t.voters[k];
    const members = names.map((name, i) => {
      const spec = sc[k] === 'U' ? ['U'] : (sc[k][i] || ['T']);
      return { name, impact: spec[0], ev: spec[1] || null };
    });
    const s = members.filter(m=>m.impact==='S').length, p = members.filter(m=>m.impact==='P').length;
    const u = members.filter(m=>m.impact==='U').length;
    const readable = members.length - u, firing = s + p;
    let side, split = false;
    if (readable === 0) side = 'unread';
    else if (firing < 2) side = 'neutral';
    else if (s > p) side = 'for'; else if (p > s) side = 'against';
    else { side = 'neutral'; split = true; }
    return { k, members, s, p, u, readable, firing, side, split };
  });
  const c = (x)=>lanes.filter(l=>l.side===x).length;
  const f=c('for'), a=c('against'), n=c('neutral'), u=c('unread');
  const net=f-a, readableLanes=f+a+n;
  let angle=0;
  if (readableLanes>=3 && net!==0) angle = Math.min(10, Math.max(3, Math.abs(net)/(f+a)*10)) * Math.sign(net); // + = for heavy
  return { lanes, f, a, n, u, net, angle };
}

/* Disc: segmented ring (one segment per readable voter, coloured by impact) around a brass face with the lane icon. */
function disc(lane, neutralFace) {
  const n = lane.members.length, R = 27, cx = 30, cy = 30, gap = 7;
  const order = [...lane.members].sort((x,y)=>'SPTU'.indexOf(x.impact)-'SPTU'.indexOf(y.impact));
  const seg = 360/n;
  let arcs = '';
  order.forEach((m, i) => {
    const a0 = (-90 + i*seg + gap/2) * Math.PI/180, a1 = (-90 + (i+1)*seg - gap/2) * Math.PI/180;
    const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0), x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    const col = m.impact==='S'?'var(--patina)':m.impact==='P'?'var(--madder)':'var(--hairline)';
    const dash = m.impact==='U' ? 'stroke-dasharray="1.5 3"' : '';
    const w = (m.impact==='S'||m.impact==='P') ? 4 : 3;
    arcs += `<path d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${dash}/>`;
  });
  const face = neutralFace ? 'url(#faceStone)' : 'url(#faceBrass)';
  const ico = neutralFace ? 'var(--ink-2)' : 'var(--brass-ink)';
  return `<svg viewBox="0 0 60 60" aria-hidden="true"><g>${arcs}</g>
    <g class="face"><circle cx="30" cy="30" r="20" fill="${face}"/><circle cx="30" cy="30" r="19.4" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".8"/><circle cx="30" cy="30" r="15.6" fill="none" stroke="rgba(0,0,0,.14)" stroke-width=".7"/></g>
    <g transform="translate(20 20) scale(.8333)" fill="none" stroke="${ico}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[lane.k]}</g></svg>`;
}

const state = { sc: 'today', theme: 'light', dir: 'ltr', open: null };
let theta = 0, anim = null, targetTheta = 0;

function t() { return I18N[state.dir === 'rtl' ? 'fa' : 'en']; }
function num(n) { return state.dir === 'rtl' ? String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : String(n); }
function numStr(s) { return state.dir === 'rtl' ? s.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]).replace('−','−') : s; }

function weightBtn(l, neutralFace) {
  const T = t();
  const badge = l.split ? `<span class="badge-split">${T.split}</span>` : '';
  return `<button class="weight" data-lane="${l.k}" aria-label="${T.lane[l.k]}: ${l.split ? T.state.split(num(l.s),num(l.p)) : T.state[l.side==='for'?'for':l.side==='against'?'against':l.side==='unread'?'unread':'neutral']}. ${T.tally(num(l.firing), num(l.readable))}">
    <span class="disc">${disc(l, neutralFace)}${badge}</span><span class="weight-label">${T.lane[l.k]}</span></button>`;
}

function render() {
  const T = t(), sc = SCENARIOS[state.sc], E = engine(sc, T);
  document.documentElement.dir = state.dir; document.documentElement.lang = state.dir==='rtl'?'fa':'en';
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  const forL = E.lanes.filter(l=>l.side==='for'), agL = E.lanes.filter(l=>l.side==='against');
  const neu = E.lanes.filter(l=>l.side==='neutral'), unr = E.lanes.filter(l=>l.side==='unread');
  const verdict = E.f+E.a+E.n===0 ? 'none' : E.net>0 ? 'for' : E.net<0 ? 'against' : 'balanced';
  const vSide = verdict==='for'?'for':verdict==='against'?'against':'';
  const up = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  const down = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 8v9H8"/></svg>';

  const ledger = E.lanes.map(l => {
    const sideKey = l.split ? 'split' : l.side;
    const stateText = l.split ? T.state.split(num(l.s), num(l.p)) : T.state[sideKey];
    const firingM = l.members.filter(m=>m.impact==='S'||m.impact==='P');
    const steady = l.members.filter(m=>m.impact==='T').map(m=>m.name);
    const unread = l.members.filter(m=>m.impact==='U');
    const open = state.open === l.k;
    return `<li class="row" open-state="${open}">
      <button class="row-btn" data-row="${l.k}" aria-expanded="${open}">
        <span class="disc">${disc(l, l.side==='neutral'||l.side==='unread')}</span>
        <span><span class="row-name">${T.lane[l.k]}</span><br><span class="row-state" data-side="${l.side}">${stateText}</span></span>
        <span class="row-tally">${T.tally(num(l.firing), num(l.readable))}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="members" ${open?'':'hidden'}>
        ${firingM.map(m=>`<div class="m" data-i="${m.impact}"><i></i><span>${m.name}</span><span class="m-ev">${T[m.impact]} · ${T.ev[m.ev]}</span></div>`).join('')}
        ${unread.map(m=>`<div class="m" data-i="U"><i></i><span>${m.name}</span><span class="m-ev">${T.U}</span></div>`).join('')}
        ${steady.length?`<div class="steady">${T.steady(num(steady.length), steady.join(state.dir==='rtl'?'، ':', '))}</div>`:''}
      </div></li>`;
  }).join('');

  document.getElementById('gb').innerHTML = `
    <header class="gb-head"><p class="gb-eyebrow">${T.eyebrow}</p><h3 class="gb-title">${T.title}</h3><p class="gb-sub">${T.sub}</p></header>
    <div class="stage" id="stage">
      <svg class="mech" id="mech" aria-hidden="true"></svg>
      <div class="pan pan-for" id="panFor"><div class="pan-cap">${up}<span>${T.capFor}</span></div>${forL.length?`<div class="weights">${forL.map(l=>weightBtn(l,false)).join('')}</div>`:`<div class="pan-empty">${T.empty}</div>`}</div>
      <div class="pan pan-against" id="panAg"><div class="pan-cap">${down}<span>${T.capAgainst}</span></div>${agL.length?`<div class="weights">${agL.map(l=>weightBtn(l,false)).join('')}</div>`:`<div class="pan-empty">${T.empty}</div>`}</div>
    </div>
    <div class="verdict">
      <div class="verdict-eyebrow">${T.verdictEyebrow}</div>
      <h4 class="verdict-word" data-side="${vSide}">${T.v[verdict]}</h4>
      <div class="lanes-bar" aria-hidden="true">${E.lanes.map(l=>`<i data-side="${l.side}"></i>`).join('')}</div>
      <p class="verdict-counts">${T.counts(num(E.f), num(E.a), num(E.n), E.u?num(E.u):0)}</p>
      <div class="context">${numStr(T.context(sc.change))}</div>
    </div>
    <div class="tray"><div class="tray-head"><span class="tray-title">${T.trayTitle}</span><span class="tray-note">${T.trayNote}</span></div>
      ${neu.length||unr.length?`<div class="weights">${neu.map(l=>weightBtn(l,true)).join('')}${unr.map(l=>weightBtn(l,true)).join('')}</div>`:`<p class="tray-empty">${T.trayEmpty}</p>`}</div>
    <ul class="ledger">${ledger}</ul>
    <p class="foot">${T.foot}</p>`;

  document.querySelectorAll('[data-row]').forEach(b => b.onclick = () => { state.open = state.open === b.dataset.row ? null : b.dataset.row; render(); });
  document.querySelectorAll('[data-lane]').forEach(b => b.onclick = () => { state.open = b.dataset.lane; render(); document.querySelector(`[data-row="${b.dataset.lane}"]`).scrollIntoView({block:'center', behavior:'smooth'}); });
  targetTheta = E.angle; layoutStage(true);
}

/* Mechanics: ONE animated value theta; beam rotates about the pivot, pans translate only (hang plumb), hangers redrawn. */
function layoutStage(animate) {
  const stage = document.getElementById('stage'); if (!stage) return;
  const W = stage.clientWidth, mobile = W < 560, rtl = state.dir === 'rtl';
  const L = mobile ? W*0.70 : Math.min(500, W*0.56), pw = mobile ? W*0.47 : Math.min(300, W*0.30);
  const pivotY = mobile ? 70 : 86, hanger = mobile ? 40 : 58, panH = mobile ? 214 : 214;
  const swing = (L/2) * Math.sin(10*Math.PI/180);
  const H = pivotY + hanger + panH + swing + 34;
  stage.style.height = H + 'px';
  const geo = { W, L, pw, pivotY, hanger, panH, swing, H, mobile, rtl };
  stage._geo = geo;
  if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    cancelAnimationFrame(anim); const from = theta, to = targetTheta, t0 = performance.now(), D = 650;
    const step = (now) => { const p = Math.min(1,(now-t0)/D), e = 1-Math.pow(1-p,4); theta = from+(to-from)*e; draw(geo); if (p<1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  } else { theta = targetTheta; draw(geo); }
}

function draw(g) {
  const { W, L, pw, pivotY, hanger, panH, swing, H, mobile, rtl } = g;
  const cx = W/2, th = theta;                 // th > 0 : "for" side heavy
  // physical angle: positive = right end down. "for" sits on the inline-start pan: left in LTR, right in RTL.
  const phys = rtl ? th : -th, rad = phys*Math.PI/180;
  const dyR = (L/2)*Math.sin(rad), dyL = -dyR;                // right end drops when phys>0
  const xR = cx + (L/2)*Math.cos(rad), xL = cx - (L/2)*Math.cos(rad);
  const panTop = pivotY + hanger + swing;
  const forIsLeft = !rtl;
  const place = (el, centerX, dy) => { el.style.width = pw+'px'; el.style.height = panH+'px'; el.style.left = (centerX - pw/2)+'px'; el.style.top = (panTop - swing + dy)+'px'; };
  const panFor = document.getElementById('panFor'), panAg = document.getElementById('panAg');
  const leftX = cx - L/2, rightX = cx + L/2;
  place(forIsLeft?panFor:panAg, leftX, dyL); place(forIsLeft?panAg:panFor, rightX, dyR);

  const brassStroke = 'var(--brass-lo)';
  const Rd = mobile ? 34 : 46;
  // dial ticks
  let ticks = '';
  for (let i=-5;i<=5;i++){ const a=(i*7)*Math.PI/180, r1=Rd, r2=Rd-(i===0?9:5); ticks += `<line x1="${cx+r1*Math.sin(a)}" y1="${pivotY-r1*Math.cos(a)}" x2="${cx+r2*Math.sin(a)}" y2="${pivotY-r2*Math.cos(a)}" stroke="var(--ink-3)" stroke-width="${i===0?1.6:1}" stroke-linecap="round" opacity="${i===0?.9:.55}"/>`; }
  const needleAngle = Math.max(-32, Math.min(32, phys*3));
  const hang = (jx, jy, panCx, panYTop) => {
    const a = panCx - pw*0.42, b = panCx + pw*0.42;
    return `<line x1="${jx}" y1="${jy}" x2="${a}" y2="${panYTop}" stroke="${brassStroke}" stroke-width="1.25" opacity=".75"/><line x1="${jx}" y1="${jy}" x2="${b}" y2="${panYTop}" stroke="${brassStroke}" stroke-width="1.25" opacity=".75"/>`;
  };
  const jyL = pivotY + dyL, jyR = pivotY + dyR;
  const topL = panTop - swing + dyL, topR = panTop - swing + dyR;
  const colTop = pivotY + 10, colBot = H - 18;
  const forCol = 'var(--patina)', agCol = 'var(--madder)';
  const leftEndCol = forIsLeft ? forCol : agCol, rightEndCol = forIsLeft ? agCol : forCol;
  const bh = mobile ? 0.8 : 1;
  const beam = `M ${-L/2} ${-3.2*bh} L -20 ${-7.5*bh} Q 0 ${-10*bh} 20 ${-7.5*bh} L ${L/2} ${-3.2*bh} L ${L/2} ${3.2*bh} L 20 ${7.5*bh} Q 0 ${10*bh} -20 ${7.5*bh} L ${-L/2} ${3.2*bh} Z`;
  document.getElementById('mech').setAttribute('viewBox', `0 0 ${W} ${H}`);
  document.getElementById('mech').innerHTML = `
    <ellipse cx="${cx}" cy="${colBot+10}" rx="${mobile?54:72}" ry="7" fill="rgba(91,61,8,.18)"/>
    <path d="M ${cx-5} ${colTop} L ${cx+5} ${colTop} L ${cx+9} ${colBot} L ${cx-9} ${colBot} Z" fill="url(#beamBrass)" opacity=".95"/>
    <rect x="${cx-(mobile?46:60)}" y="${colBot}" width="${mobile?92:120}" height="12" rx="6" fill="url(#beamBrass)"/>
    ${ticks}
    <path d="M ${cx+Rd*Math.sin(-35*Math.PI/180)} ${pivotY-Rd*Math.cos(35*Math.PI/180)} A ${Rd} ${Rd} 0 0 1 ${cx+Rd*Math.sin(35*Math.PI/180)} ${pivotY-Rd*Math.cos(35*Math.PI/180)}" fill="none" stroke="var(--hairline)" stroke-width="1"/>
    ${hang(xL, jyL, leftX, topL)}${hang(xR, jyR, rightX, topR)}
    <g transform="rotate(${phys} ${cx} ${pivotY})">
      <g transform="translate(${cx} ${pivotY})"><path d="${beam}" fill="url(#beamBrass)" stroke="var(--brass-lo)" stroke-width=".6"/><path d="M ${-L/2+6} ${-1.6*bh} L ${L/2-6} ${-1.6*bh}" stroke="rgba(255,255,255,.55)" stroke-width="1" stroke-linecap="round"/></g>
      <circle cx="${cx-L/2}" cy="${pivotY}" r="7" fill="var(--paper)" stroke="${leftEndCol}" stroke-width="3"/>
      <circle cx="${cx+L/2}" cy="${pivotY}" r="7" fill="var(--paper)" stroke="${rightEndCol}" stroke-width="3"/>
    </g>
    <line x1="${cx}" y1="${pivotY}" x2="${cx+(Rd-3)*Math.sin(needleAngle*Math.PI/180)}" y2="${pivotY-(Rd-3)*Math.cos(needleAngle*Math.PI/180)}" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${pivotY}" r="${mobile?10:12}" fill="url(#faceBrass)" stroke="var(--brass-lo)" stroke-width="1"/>
    <circle cx="${cx}" cy="${pivotY}" r="${mobile?3.6:4.4}" fill="var(--ink)"/><circle cx="${cx-1.2}" cy="${pivotY-1.4}" r="1.2" fill="rgba(255,255,255,.7)"/>`;
}

/* Demo bar */
function bar() {
  const el = document.getElementById('bar');
  el.innerHTML = Object.entries(SCENARIOS).map(([k,v])=>`<button data-sc="${k}" aria-pressed="${state.sc===k}">${v.label}</button>`).join('') +
    `<button data-act="theme" aria-pressed="${state.theme==='dark'}">Dark</button><button data-act="dir" aria-pressed="${state.dir==='rtl'}">RTL · فارسی</button>`;
  el.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{state.sc=b.dataset.sc; bar(); render();});
  el.querySelector('[data-act="theme"]').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark'; bar(); render();};
  el.querySelector('[data-act="dir"]').onclick=()=>{state.dir=state.dir==='rtl'?'ltr':'rtl'; bar(); render();};
}
const q = new URLSearchParams(location.search);
if (q.get('sc')) state.sc = q.get('sc'); if (q.get('theme')) state.theme = q.get('theme'); if (q.get('dir')) state.dir = q.get('dir'); if (q.get('open')) state.open = q.get('open');
bar(); render(); addEventListener('resize', () => layoutStage(false));
</script>
</body>
</html>
