<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E8F4F8" />
    <meta
      name="description"
      content="Modern currency converter with live Iranian Toman rates"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Currena — Currency Converter</title>
    <script>
      // Pre-paint init (no flash): theme class + locale dir/lang, BEFORE first
      // paint. Keys: 'theme' (legacy parity) and 'currena:locale' (mission §8).
      // Must stay in vanilla JS — runs before the module bundle.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        var l = localStorage.getItem('currena:locale') || 'en';
        if (l !== 'en' && l !== 'fa') l = 'en';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
