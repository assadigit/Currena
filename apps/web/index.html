<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E8F4F8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Currena — Currency Converter</title>
    <script>
      // RTL/LTR from day one: dir on <html> derived from locale, before first paint.
      // Legacy default locale is English (verified in Phase 1); fa switches to rtl.
      try {
        var l = localStorage.getItem('locale') || 'en';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
