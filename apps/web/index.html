<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E8F4F8" />
    <meta
      name="description"
      content="Modern currency converter with live Iranian Toman rates"
    />
    <!-- Social share cards (SWOT fix 2026-09-19): link previews in Telegram /
         WhatsApp / X — the primary sharing surface for this audience — get a
         title, description and image instead of a bare URL. -->
    <meta property="og:title" content="Currena | Currency Converter" />
    <meta property="og:description" content="Live Iranian Toman rates: currency & gold LED boards, instant converter." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://currena.ir/" />
    <meta property="og:image" content="https://currena.ir/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Currena | Currency Converter" />
    <meta name="twitter:description" content="Live Iranian Toman rates: currency & gold LED boards, instant converter." />
    <meta name="twitter:image" content="https://currena.ir/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Font preloads (audit D minor): both faces ship as static files under
         /fonts (see the @font-face blocks in src/index.css), so plain URLs —
         no build-time hashing involved. crossorigin is required even
         same-origin: font fetches always go through CORS, and the preload
         must match. DSEG7 Bold is the face the LED boards actually paint
         (.led-digits is font-weight 700; the Regular face stays unloaded).
         Vazirmatn (one variable file, all weights) renders only :lang(fa)
         pages; the unconditional preload trades its ~109KB upfront fetch on
         every locale for a no-swap first paint on fa. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dseg/DSEG7Classic-Bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/vazirmatn-var.woff2" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Currena | Currency Converter</title>
    <script>
      // Pre-paint init (no flash): locale dir/lang + theme class, BEFORE
      // first paint. Keys: 'currena:locale' (mission §8) and the LEGACY
      // 'theme' key (light|dark — light is the default). Must stay in
      // vanilla JS — runs before the module bundle.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        var l = localStorage.getItem('currena:locale') || 'en';
        if (l !== 'en' && l !== 'fa') l = 'en';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Currena requires JavaScript to run — please enable it in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
